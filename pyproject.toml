[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-data-pipeline"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=planner.handler --cov=collector.handler --cov=curator.handler --cov=publisher.handler --cov=shared --cov-report=term-missing --cov-fail-under=80"
markers = [
  "integration: requires LocalStack running at LOCALSTACK_ENDPOINT",
]

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py313"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
