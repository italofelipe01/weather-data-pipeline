AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AWS SAM template for collecting temporal weather snapshots with OpenWeather Free plan APIs.

Globals:
  Function:
    Runtime: python3.13
    Timeout: 60
    MemorySize: 256
    Environment:
      Variables:
        API_KEY_CACHE_TTL_SECONDS: "300"
        SOURCE_TIMEOUT_SECONDS: "30"

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z][a-z0-9-]{1,15}$"
  OpenWeatherApiKeyParameterName:
    Type: String
    Default: /weather-data-pipeline/dev/openweather-api-key
    Description: SecureString parameter created externally with the OpenWeather API key.
  MonthlyOperationalCallLimit:
    Type: Number
    Default: 500000
    MinValue: 1
    MaxValue: 500000
    Description: 50 percent of the documented 1,000,000 calls/month Free plan limit.
  RawDataRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 90
    Description: Raw JSON retention. Keep short because curated aggregates are the long-term layer.
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]
    Description: CloudWatch Logs retention in days.
  MonthlyBudgetAmount:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100
    Description: Monthly AWS budget amount in USD. Used only when BudgetAlertEmail is provided.
  BudgetAlertEmail:
    Type: String
    Default: ""
    Description: Optional email for AWS Budget alerts. Leave empty to skip budget creation.
  EnableSchedules:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

Conditions:
  SchedulesEnabled: !Equals [!Ref EnableSchedules, "true"]
  BudgetAlertsEnabled: !Not [!Equals [!Ref BudgetAlertEmail, ""]]

Resources:
  RawDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-raw-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
        IgnorePublicAcls: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-raw-source
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: !Ref RawDataRetentionDays
          - Id: expire-rejected-source
            Status: Enabled
            Prefix: rejected/
            ExpirationInDays: !Ref RawDataRetentionDays
          - Id: expire-temporary
            Status: Enabled
            Prefix: tmp/
            ExpirationInDays: 7
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  RawDataBucketTlsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RawDataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub "${RawDataBucket.Arn}"
              - !Sub "${RawDataBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      ContentBasedDeduplication: true
      QueueName: !Sub "${AWS::StackName}-source-dlq.fifo"
      MessageRetentionPeriod: 1209600

  CollectionQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      ContentBasedDeduplication: false
      QueueName: !Sub "${AWS::StackName}-source.fifo"
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3

  PlannerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: planner.handler.lambda_handler
      Environment:
        Variables:
          COLLECTION_QUEUE_URL: !Ref CollectionQueue
          OPENWEATHER_UNITS: metric
          OPENWEATHER_LANG: pt_br
          OPENWEATHER_PRODUCTS: current_weather
          MONTHLY_OPERATIONAL_CALL_LIMIT: !Ref MonthlyOperationalCallLimit
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt CollectionQueue.Arn
      Events:
        CurrentWeatherPlan:
          Type: Schedule
          Properties:
            Enabled: !If [SchedulesEnabled, true, false]
            Schedule: rate(3 minutes)
            Input: '{"products": ["current_weather"]}'
        ForecastPlan:
          Type: Schedule
          Properties:
            Enabled: !If [SchedulesEnabled, true, false]
            Schedule: cron(5 * * * ? *)
            Input: '{"products": ["forecast_5d_3h"]}'

  CollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: collector.handler.lambda_handler
      Environment:
        Variables:
          RAW_DATA_BUCKET_NAME: !Ref RawDataBucket
          OPENWEATHER_API_KEY_PARAMETER_NAME: !Ref OpenWeatherApiKeyParameterName
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${RawDataBucket}/*"
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${OpenWeatherApiKeyParameterName}"
      Events:
        CollectionQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt CollectionQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

  CuratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: curator.handler.lambda_handler
      Timeout: 120
      Environment:
        Variables:
          RAW_DATA_BUCKET_NAME: !Ref RawDataBucket
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub "arn:${AWS::Partition}:s3:::${RawDataBucket}"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${RawDataBucket}/*"
      Events:
        HourlyCuratorPlan:
          Type: Schedule
          Properties:
            Enabled: !If [SchedulesEnabled, true, false]
            Schedule: cron(20 * * * ? *)
            Input: '{}'

  PlannerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PlannerFunction}"
      RetentionInDays: !Ref LogRetentionDays

  CollectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CollectorFunction}"
      RetentionInDays: !Ref LogRetentionDays

  CuratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CuratorFunction}"
      RetentionInDays: !Ref LogRetentionDays

  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Condition: BudgetAlertsEnabled
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly-cost"
        BudgetLimit:
          Amount: !Ref MonthlyBudgetAmount
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail

  CollectorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-collector-errors"
      Namespace: WeatherDataPipeline
      MetricName: SourceJobFailures
      Dimensions:
        - Name: FunctionName
          Value: !Ref CollectorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  CuratorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-curator-errors"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CuratorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DlqVisibleMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-source-dlq-visible"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  OldestMessageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-source-oldest-message"
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CollectionQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  RawDataBucketName:
    Value: !Ref RawDataBucket
  CollectionQueueUrl:
    Value: !Ref CollectionQueue
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
  PlannerFunctionName:
    Value: !Ref PlannerFunction
  CollectorFunctionName:
    Value: !Ref CollectorFunction
  CuratorFunctionName:
    Value: !Ref CuratorFunction
  OpenWeatherApiKeyParameterName:
    Value: !Ref OpenWeatherApiKeyParameterName
  MonthlyOperationalCallLimit:
    Value: !Ref MonthlyOperationalCallLimit
  RawDataRetentionDays:
    Value: !Ref RawDataRetentionDays
  MonthlyBudgetAmount:
    Value: !Ref MonthlyBudgetAmount
