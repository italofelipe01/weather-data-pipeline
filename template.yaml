  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Condition: AnalyticsEnabled
    Properties:
      Name: !Ref AWS::StackName
      Description: Queries over the curated weather tables (1 GB scan cap per query).
      RecursiveDeleteOption: true
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: false
        BytesScannedCutoffPerQuery: 1073741824
        EngineVersion:
          SelectedEngineVersion: Athena engine version 3
        ResultConfiguration:
          OutputLocation: !Sub "s3://${RawDataBucket}/athena-results/"
          EncryptionConfiguration:
            EncryptionOption: SSE_S3

Outputs:
  RawDataBucketName:
    Value: !Ref RawDataBucket
  SiteBucketName:
    Value: !Ref SiteBucket
  DashboardUrl:
    Condition: FrontendEnabled
    Value: !Sub "https://${SiteDistribution.DomainName}/"
  SiteDistributionId:
    Condition: FrontendEnabled
    Value: !Ref SiteDistribution
  CollectionQueueUrl:
    Value: !Ref CollectionQueue
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
  PlannerFunctionName:
    Value: !Ref PlannerFunction
  CollectorFunctionName:
    Value: !Ref CollectorFunction
  CuratorFunctionName:
    Value: !Ref CuratorFunction
  PublisherFunctionName:
    Value: !Ref PublisherFunction
  AlertTopicArn:
    Value: !Ref AlertTopic
  OperationsDashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${OperationsDashboard}"
  GlueDatabaseName:
    Condition: AnalyticsEnabled
    Value: !Ref GlueDatabase
  AthenaWorkGroupName:
    Condition: AnalyticsEnabled
    Value: !Ref AthenaWorkGroup
  OpenWeatherApiKeyParameterName:
    Value: !If [HasCustomApiKeyParameter, !Ref OpenWeatherApiKeyParameterName, !Sub "/weather-data-pipeline/${Environment}/openweather-api-key"]
  MonthlyOperationalCallLimit:
    Value: !Ref MonthlyOperationalCallLimit
  RawDataRetentionDays:
    Value: !Ref RawDataRetentionDays
  MonthlyBudgetAmount:
    Value: !Ref MonthlyBudgetAmount
