AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless weather time series for the 27 Brazilian capitals built only with OpenWeather Free plan APIs
  (Current Weather, 5 Day / 3 Hour Forecast and Air Pollution), with curated Parquet tables, Athena tables
  and a static dashboard served by CloudFront.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Pipeline}
        Parameters: [Environment, EnableSchedules, CurrentWeatherScheduleExpression, EnableAirPollution, OpenWeatherApiKeyParameterName]
      - Label: {default: Cost controls}
        Parameters: [MonthlyOperationalCallLimit, RawDataRetentionDays, LogRetentionDays, MonthlyBudgetAmount, BudgetAlertEmail]
      - Label: {default: Consumption}
        Parameters: [EnableFrontend, EnableAnalytics]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [x86_64]
    Timeout: 60
    MemorySize: 256
    Environment:
      Variables:
        PIPELINE_NAME: !Ref AWS::StackName
        METRICS_NAMESPACE: WeatherDataPipeline
        API_KEY_CACHE_TTL_SECONDS: "300"
        SOURCE_TIMEOUT_SECONDS: "10"

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z][a-z0-9-]{1,15}$"
  OpenWeatherApiKeyParameterName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^/[A-Za-z0-9_.\\-/]+$"
    Description: SecureString parameter with the OpenWeather API key. Empty uses /weather-data-pipeline/<Environment>/openweather-api-key.
  MonthlyOperationalCallLimit:
    Type: Number
    Default: 500000
    MinValue: 1
    MaxValue: 500000
    Description: Enforced by the Planner. 50 percent of the documented 1,000,000 calls/month Free plan limit.
  CurrentWeatherScheduleExpression:
    Type: String
    Default: cron(0/3 * * * ? *)
    Description: Current Weather cadence. The default (every 3 minutes) keeps the projected total near 445,000 calls in a 31-day month.
  EnableAirPollution:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Collect the free Air Pollution API (hourly current values and a 4-day forecast every 6 hours).
  RawDataRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 90
    Description: Raw JSON retention. Keep short because curated tables are the long-term layer.
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]
    Description: CloudWatch Logs retention in days.
  MonthlyBudgetAmount:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100
    Description: Monthly AWS budget amount in USD. Used only when BudgetAlertEmail is provided.
  BudgetAlertEmail:
    Type: String
    Default: ""
    Description: Optional email for AWS Budget alerts and pipeline alarms (SNS). Leave empty to skip both subscriptions.
  EnableSchedules:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  EnableFrontend:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Serve the dashboard through CloudFront (Free tier covers 1 TB and 10M requests per month).
  EnableAnalytics:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Glue Data Catalog tables with partition projection plus an Athena workgroup capped at 1 GB scanned per query. No crawler, no idle cost.

Conditions:
  SchedulesEnabled: !Equals [!Ref EnableSchedules, "true"]
  AirPollutionSchedulesEnabled: !And [!Condition SchedulesEnabled, !Equals [!Ref EnableAirPollution, "true"]]
  BudgetAlertsEnabled: !Not [!Equals [!Ref BudgetAlertEmail, ""]]
  FrontendEnabled: !Equals [!Ref EnableFrontend, "true"]
  AnalyticsEnabled: !Equals [!Ref EnableAnalytics, "true"]
  HasCustomApiKeyParameter: !Not [!Equals [!Ref OpenWeatherApiKeyParameterName, ""]]

Resources:
  RawDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-raw-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
        IgnorePublicAcls: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-raw-source
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: !Ref RawDataRetentionDays
          - Id: expire-rejected-source
            Status: Enabled
            Prefix: rejected/
            ExpirationInDays: !Ref RawDataRetentionDays
          - Id: expire-temporary
            Status: Enabled
            Prefix: tmp/
            ExpirationInDays: 7
          - Id: expire-athena-results
            Status: Enabled
            Prefix: athena-results/
            ExpirationInDays: 7
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  RawDataBucketTlsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RawDataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub "${RawDataBucket.Arn}"
              - !Sub "${RawDataBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # Static dashboard (frontend/) plus the JSON documents under data/ written by the Curator and the Publisher.
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
        IgnorePublicAcls: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub "${SiteBucket.Arn}"
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false
          - !If
            - FrontendEnabled
            - Sid: AllowCloudFrontRead
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub "${SiteBucket.Arn}/*"
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"
            - !Ref AWS::NoValue

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: FrontendEnabled
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDataCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Condition: FrontendEnabled
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-data"
        Comment: Short TTL for dashboard JSON refreshed every 10 minutes.
        DefaultTTL: 60
        MaxTTL: 300
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  SiteResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Condition: FrontendEnabled
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; img-src 'self' data: https://openweathermap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: FrontendEnabled
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} weather dashboard"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SiteResponseHeadersPolicy
        CacheBehaviors:
          - PathPattern: data/*
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref SiteDataCachePolicy
            ResponseHeadersPolicyId: !Ref SiteResponseHeadersPolicy

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alerts"
      DisplayName: Weather pipeline alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: BudgetAlertsEnabled
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref BudgetAlertEmail

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      ContentBasedDeduplication: true
      QueueName: !Sub "${AWS::StackName}-source-dlq.fifo"
      MessageRetentionPeriod: 1209600

  CollectionQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      ContentBasedDeduplication: false
      QueueName: !Sub "${AWS::StackName}-source.fifo"
      # AWS recommends at least six times the consumer timeout for SQS event sources.
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3

  AnalyticsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-analytics"
      Description: pyarrow for the Parquet curated tables (Curator only).
      ContentUri: layers/analytics/
      CompatibleRuntimes: [python3.13]
      CompatibleArchitectures: [x86_64]
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.13
      BuildArchitecture: x86_64

  PlannerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: planner.handler.lambda_handler
      Description: Plans one OpenWeather job per capital and product and enforces the monthly call limit.
      Environment:
        Variables:
          COLLECTION_QUEUE_URL: !Ref CollectionQueue
          OPENWEATHER_UNITS: metric
          OPENWEATHER_LANG: pt_br
          OPENWEATHER_PRODUCTS: current_weather
          MONTHLY_OPERATIONAL_CALL_LIMIT: !Ref MonthlyOperationalCallLimit
          CALL_BUDGET_ENFORCED: "true"
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt CollectionQueue.Arn
            - Effect: Allow
              Action:
                - cloudwatch:GetMetricData
              Resource: "*"
      Events:
        CurrentWeatherPlan:
          Type: Schedule
          Properties:
            Enabled: !If [SchedulesEnabled, true, false]
            Schedule: !Ref CurrentWeatherScheduleExpression
            Input: '{"products": ["current_weather"]}'
        ForecastPlan:
          Type: Schedule
          Properties:
            Enabled: !If [SchedulesEnabled, true, false]
            Schedule: cron(5 * * * ? *)
            Input: '{"products": ["forecast_5d_3h"]}'
        AirPollutionPlan:
          Type: Schedule
          Properties:
            Enabled: !If [AirPollutionSchedulesEnabled, true, false]
            Schedule: cron(35 * * * ? *)
            Input: '{"products": ["air_pollution"]}'
        AirPollutionForecastPlan:
          Type: Schedule
          Properties:
            Enabled: !If [AirPollutionSchedulesEnabled, true, false]
            Schedule: cron(50 0/6 * * ? *)
            Input: '{"products": ["air_pollution_forecast"]}'

  CollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: collector.handler.lambda_handler
      Description: Calls the OpenWeather Free plan APIs and stores raw JSON snapshots.
      Environment:
        Variables:
          RAW_DATA_BUCKET_NAME: !Ref RawDataBucket
          OPENWEATHER_API_KEY_PARAMETER_NAME: !If [HasCustomApiKeyParameter, !Ref OpenWeatherApiKeyParameterName, !Sub "/weather-data-pipeline/${Environment}/openweather-api-key"]
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${RawDataBucket}/raw/*"
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !If
                - HasCustomApiKeyParameter
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${OpenWeatherApiKeyParameterName}"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/weather-data-pipeline/${Environment}/openweather-api-key"
      Events:
        CollectionQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt CollectionQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              # Keeps bursts well under the 60 calls/minute Free plan limit.
              MaximumConcurrency: 2

  CuratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: curator.handler.lambda_handler
      Description: Builds hourly, daily and forecast Parquet tables, catches up missed hours and publishes dashboard series.
      Timeout: 300
      MemorySize: 1024
      Layers:
        - !Ref AnalyticsLayer
      Environment:
        Variables:
          RAW_DATA_BUCKET_NAME: !Ref RawDataBucket
          SITE_BUCKET_NAME: !Ref SiteBucket
          CURATOR_LOOKBACK_HOURS: "6"
          DAILY_LOOKBACK_DAYS: "3"
          SERVING_HOURLY_DAYS: "7"
          SERVING_DAILY_DAYS: "730"
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource:
                - !Sub "arn:${AWS::Partition}:s3:::${RawDataBucket}"
                - !Sub "arn:${AWS::Partition}:s3:::${SiteBucket}"
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${RawDataBucket}/*"
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${RawDataBucket}/curated/*"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${SiteBucket}/data/*"
      Events:
        HourlyCuratorPlan:
          Type: Schedule
          Properties:
            Enabled: !If [SchedulesEnabled, true, false]
            Schedule: cron(20 * * * ? *)
            Input: '{}'

  PublisherFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: publisher.handler.lambda_handler
      Description: Publishes the latest observation and air quality per capital (data/latest.json) for the dashboard.
      Timeout: 120
      Environment:
        Variables:
          RAW_DATA_BUCKET_NAME: !Ref RawDataBucket
          SITE_BUCKET_NAME: !Ref SiteBucket
          LATEST_LOOKBACK_HOURS: "3"
          MONTHLY_OPERATIONAL_CALL_LIMIT: !Ref MonthlyOperationalCallLimit
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource:
                - !Sub "arn:${AWS::Partition}:s3:::${RawDataBucket}"
                - !Sub "arn:${AWS::Partition}:s3:::${SiteBucket}"
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${RawDataBucket}/raw/*"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${SiteBucket}/data/*"
            - Effect: Allow
              Action:
                - cloudwatch:GetMetricData
              Resource: "*"
      Events:
        LatestPublishPlan:
          Type: Schedule
          Properties:
            Enabled: !If [SchedulesEnabled, true, false]
            Schedule: rate(10 minutes)
            Input: '{}'

  PlannerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PlannerFunction}"
      RetentionInDays: !Ref LogRetentionDays

  CollectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CollectorFunction}"
      RetentionInDays: !Ref LogRetentionDays

  CuratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CuratorFunction}"
      RetentionInDays: !Ref LogRetentionDays

  PublisherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PublisherFunction}"
      RetentionInDays: !Ref LogRetentionDays

  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Condition: BudgetAlertsEnabled
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly-cost"
        BudgetLimit:
          Amount: !Ref MonthlyBudgetAmount
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail

  # Alarms stay within the CloudWatch free tier (10 alarm metrics) and notify AlertTopic.
  CollectorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-collector-errors"
      AlarmDescription: OpenWeather jobs are failing and being retried (HTTP 429/5xx, timeouts or an invalid API key).
      Namespace: WeatherDataPipeline
      MetricName: SourceJobFailures
      Dimensions:
        - Name: Pipeline
          Value: !Ref AWS::StackName
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  SourceRejectedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-source-rejected"
      AlarmDescription: OpenWeather answered with a non-retryable error or an unexpected payload; those jobs were dropped.
      Namespace: WeatherDataPipeline
      MetricName: SourceJobsRejected
      Dimensions:
        - Name: Pipeline
          Value: !Ref AWS::StackName
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  CallBudgetAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-monthly-call-limit"
      AlarmDescription: The Planner skipped collections because MonthlyOperationalCallLimit was reached.
      Namespace: WeatherDataPipeline
      MetricName: CollectionJobsSkipped
      Dimensions:
        - Name: Pipeline
          Value: !Ref AWS::StackName
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  CollectionStalledAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: SchedulesEnabled
    Properties:
      AlarmName: !Sub "${AWS::StackName}-collection-stalled"
      AlarmDescription: No OpenWeather snapshot was stored for 30 minutes while schedules are enabled.
      Namespace: WeatherDataPipeline
      MetricName: SourceJobsCollected
      Dimensions:
        - Name: Pipeline
          Value: !Ref AWS::StackName
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  PlannerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-planner-errors"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PlannerFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  CuratorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-curator-errors"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CuratorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  PublisherErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-publisher-errors"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PublisherFunction
      Statistic: Sum
      Period: 1800
      EvaluationPeriods: 1
      Threshold: 2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  DlqVisibleMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-source-dlq-visible"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  OldestMessageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-source-oldest-message"
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CollectionQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-operations"
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6, "properties": {
              "title": "OpenWeather calls and stored snapshots", "region": "${AWS::Region}", "stat": "Sum", "period": 3600, "view": "timeSeries",
              "metrics": [
                ["WeatherDataPipeline", "OpenWeatherApiCalls", "Pipeline", "${AWS::StackName}"],
                [".", "SourceJobsCollected", ".", "."],
                [".", "SourceJobFailures", ".", "."],
                [".", "SourceJobsRejected", ".", "."]
              ]}},
            {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6, "properties": {
              "title": "OpenWeather calls this month (limit ${MonthlyOperationalCallLimit})", "region": "${AWS::Region}", "stat": "Sum", "period": 2592000, "view": "singleValue",
              "metrics": [["WeatherDataPipeline", "OpenWeatherApiCalls", "Pipeline", "${AWS::StackName}"]]}},
            {"type": "metric", "x": 0, "y": 6, "width": 12, "height": 6, "properties": {
              "title": "Lambda errors", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
              "metrics": [
                ["AWS/Lambda", "Errors", "FunctionName", "${PlannerFunction}"],
                ["...", "${CollectorFunction}"],
                ["...", "${CuratorFunction}"],
                ["...", "${PublisherFunction}"]
              ]}},
            {"type": "metric", "x": 12, "y": 6, "width": 12, "height": 6, "properties": {
              "title": "Queues", "region": "${AWS::Region}", "stat": "Maximum", "period": 300, "view": "timeSeries",
              "metrics": [
                ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${CollectionQueue.QueueName}"],
                ["...", "${DeadLetterQueue.QueueName}"],
                [".", "ApproximateAgeOfOldestMessage", ".", "${CollectionQueue.QueueName}"]
              ]}},
            {"type": "metric", "x": 0, "y": 12, "width": 12, "height": 6, "properties": {
              "title": "Curated hourly rows", "region": "${AWS::Region}", "stat": "Sum", "period": 3600, "view": "timeSeries",
              "metrics": [
                ["WeatherDataPipeline", "HourlyObservationRecords", "Pipeline", "${AWS::StackName}"],
                [".", "CuratedHours", ".", "."],
                [".", "CollectionJobsSkipped", ".", "."]
              ]}},
            {"type": "metric", "x": 12, "y": 12, "width": 12, "height": 6, "properties": {
              "title": "Lambda duration (p95)", "region": "${AWS::Region}", "stat": "p95", "period": 3600, "view": "timeSeries",
              "metrics": [
                ["AWS/Lambda", "Duration", "FunctionName", "${CollectorFunction}"],
                ["...", "${CuratorFunction}"],
                ["...", "${PublisherFunction}"]
              ]}}
          ]
        }

  GlueDatabase:
    Type: AWS::Glue::Database
    Condition: AnalyticsEnabled
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Join ["_", ["weather", !Join ["_", !Split ["-", !Ref Environment]]]]
        Description: Curated OpenWeather tables for the Brazilian capitals (partition projection, no crawler).

  HourlyObservationsTable:
    Type: AWS::Glue::Table
    Condition: AnalyticsEnabled
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: weather_hourly_observations
        Description: One row per capital per UTC hour (current weather + air pollution).
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          EXTERNAL: "TRUE"
          projection.enabled: "true"
          projection.year.type: integer
          projection.year.range: "2025,2035"
          projection.month.type: integer
          projection.month.range: "1,12"
          projection.month.digits: "2"
          projection.day.type: integer
          projection.day.range: "1,31"
          projection.day.digits: "2"
          projection.hour.type: integer
          projection.hour.range: "0,23"
          projection.hour.digits: "2"
          storage.location.template: !Sub "s3://${RawDataBucket}/curated/hourly_observations/year=${!year}/month=${!month}/day=${!day}/hour=${!hour}/"
        PartitionKeys:
          - {Name: year, Type: int}
          - {Name: month, Type: int}
          - {Name: day, Type: int}
          - {Name: hour, Type: int}
        StorageDescriptor:
          Location: !Sub "s3://${RawDataBucket}/curated/hourly_observations/"
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          Columns:
            - {Name: observation_date, Type: date}
            - {Name: observation_hour, Type: smallint}
            - {Name: observation_timestamp, Type: timestamp}
            - {Name: local_date, Type: date}
            - {Name: local_hour, Type: smallint}
            - {Name: city, Type: string}
            - {Name: state, Type: string}
            - {Name: region, Type: string}
            - {Name: ibge_code, Type: string}
            - {Name: latitude, Type: double}
            - {Name: longitude, Type: double}
            - {Name: temperature_avg, Type: double}
            - {Name: temperature_min, Type: double}
            - {Name: temperature_max, Type: double}
            - {Name: feels_like_avg, Type: double}
            - {Name: humidity_avg, Type: double}
            - {Name: humidity_min, Type: double}
            - {Name: humidity_max, Type: double}
            - {Name: pressure_avg, Type: double}
            - {Name: sea_level_pressure_avg, Type: double}
            - {Name: ground_level_pressure_avg, Type: double}
            - {Name: wind_speed_avg, Type: double}
            - {Name: wind_speed_max, Type: double}
            - {Name: wind_gust_max, Type: double}
            - {Name: wind_deg_avg, Type: double}
            - {Name: clouds_avg, Type: double}
            - {Name: visibility_avg, Type: double}
            - {Name: rain_mm, Type: double}
            - {Name: rain_rate_max, Type: double}
            - {Name: snow_mm, Type: double}
            - {Name: weather_id, Type: int}
            - {Name: weather_main, Type: string}
            - {Name: weather_description, Type: string}
            - {Name: weather_icon, Type: string}
            - {Name: sunrise, Type: timestamp}
            - {Name: sunset, Type: timestamp}
            - {Name: aqi, Type: tinyint}
            - {Name: co, Type: double}
            - {Name: "no", Type: double}
            - {Name: no2, Type: double}
            - {Name: o3, Type: double}
            - {Name: so2, Type: double}
            - {Name: pm2_5, Type: double}
            - {Name: pm10, Type: double}
            - {Name: nh3, Type: double}
            - {Name: sample_count, Type: smallint}
            - {Name: observation_count, Type: smallint}
            - {Name: air_sample_count, Type: smallint}
            - {Name: source_product, Type: string}
