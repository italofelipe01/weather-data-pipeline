name: Deploy

# Requires an IAM role trusted for GitHub OIDC (secret AWS_DEPLOY_ROLE_ARN); see README "Deploy pelo GitHub Actions".
# Pushes to main deploy automatically only when the repository variable AUTO_DEPLOY is "true".
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment name (stack weather-data-pipeline-<environment>)
        required: true
        default: dev
      enable_schedules:
        description: Enable the EventBridge schedules
        type: choice
        options: ["true", "false"]
        default: "true"
      run_initial_collection:
        description: Collect every product once and publish the dashboard right after the deploy
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment || 'dev' }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'sa-east-1' }}
      TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      ENABLE_SCHEDULES: ${{ inputs.enable_schedules || vars.ENABLE_SCHEDULES || 'false' }}
      RUN_INITIAL_COLLECTION: ${{ inputs.run_initial_collection || false }}
      BUDGET_ALERT_EMAIL: ${{ vars.BUDGET_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Test before deploying
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Deploy stack, API key and dashboard
        shell: pwsh
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          if ($env:TARGET_ENVIRONMENT -notmatch '^[a-z][a-z0-9-]{1,15}$') { throw "Invalid environment name" }
          $deploy = @{
            StackName       = "weather-data-pipeline-$($env:TARGET_ENVIRONMENT)"
            Environment     = $env:TARGET_ENVIRONMENT
            Region          = $env:AWS_REGION
            EnableSchedules = $env:ENABLE_SCHEDULES
            NoContainer     = $true
          }
          if ($env:BUDGET_ALERT_EMAIL) { $deploy.BudgetAlertEmail = $env:BUDGET_ALERT_EMAIL }
          if ($env:RUN_INITIAL_COLLECTION -eq "true") { $deploy.RunInitialCollection = $true }
          ./scripts/deploy.ps1 @deploy
